[config]
schemaVersion = "0.0.1"

[package]
namespace = "HiarlyScripter"
name = "BagExpander"
versionNumber = "1.0.6"
description = "Expand your bag! Configure from 0 to 10 inventory slots, with full multiplayer support and host control."
websiteUrl = "https://discord.com/users/hiarly_ferreira"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2305"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[[build.copy]]
source = "./package/plugins"
target = ""

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "repo", ]

[publish.categories]
repo = [ "mods", "upgrades", "quality-of-life", "serverside", "ai-generated", ]
